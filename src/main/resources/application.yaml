server:
  port: 8000

spring:
  application:
    name: auth-service

eureka:
  client:
    enabled: true
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8080/api/users}

https:
  enabled: ${HTTPS_ENABLED:false}
jwt:
  refresh:
    duration: ${JWT_REFRESH_DURATION:120} # this in minutes
  access:
    duration: ${JWT_EXPIRATION_TIME:240} # this in seconds
  id: ${JWT_KEY_ID:c3e9666f-7744-4f50-ab86-4c99b841c01d}
  public:
    key: ${JWT_PUBLIC_KEY:}